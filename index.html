<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRUX — Bouldering Log</title>
<meta name="description" content="A minimal bouldering training tracker: plan your week, log sessions, see progress.">
<meta name="theme-color" content="#16130F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CRUX">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20512%20512'%3E%3Crect%20width='512'%20height='512'%20rx='96'%20fill='%2316130F'/%3E%3Cpath%20d='M156%20156L356%20356M356%20156L156%20356'%20stroke='%23E5484D'%20stroke-width='58'%20stroke-linecap='round'%20fill='none'/%3E%3C/svg%3E">
<style>
  :root{
    --panel:#201C17; --raise:#2A251F; --line:#332D26;
    --chalk:#F1EDE6; --dim:#B7B0A5; --muted:#7E766B;
    --font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;}
  body{
    font-family:var(--font); color:var(--chalk);
    background:#16130F; background:radial-gradient(120% 80% at 50% -8%, #221D15 0%, #16130F 58%) fixed;
    -webkit-font-smoothing:antialiased; line-height:1.45;
  }
  .app{padding-bottom:env(safe-area-inset-bottom);}
  .top{display:flex;align-items:center;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top)) 18px 0;max-width:680px;margin:0 auto;}
  .brand{display:flex;align-items:baseline;gap:11px;}
  .logo{font-weight:800;font-size:22px;letter-spacing:.16em;}
  .logo .x{color:#E5484D;}
  .tag{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.16em;}

  .tabs{display:flex;gap:4px;margin:16px auto 0;max-width:680px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;width:calc(100% - 28px);}
  .tab{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:5px;padding:9px 4px;border:none;background:transparent;color:var(--muted);font-family:var(--font);font-weight:600;font-size:12.5px;white-space:nowrap;border-radius:9px;cursor:pointer;transition:.15s;}
  .tab:hover{color:var(--dim);}
  .tab.active{background:var(--raise);color:var(--chalk);}
  .tab svg{display:block;flex:none;}

  .wrap{padding:16px 14px 44px;max-width:680px;margin:0 auto;}
  .hint{font-size:13px;color:var(--muted);margin:2px 2px 14px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
  .lbl{font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--muted);margin:16px 0 9px;font-weight:600;}
  .lbl.first{margin-top:0;}

  .day{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;background:var(--panel);}
  .day.rest{opacity:.6;}
  .dow{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--dim);width:32px;text-transform:uppercase;flex:none;}
  .mk{display:inline-flex;align-items:center;flex:none;width:14px;justify-content:center;}
  .mk svg{color:var(--muted);}
  .dot{width:8px;height:8px;border-radius:50%;background:#E7C13B;}
  .focus-in{flex:1;background:transparent;border:none;color:var(--chalk);font-family:var(--font);font-size:14.5px;outline:none;padding:2px 0;min-width:0;}
  .focus-in::placeholder{color:var(--muted);}

  .inp{background:var(--raise);border:1px solid var(--line);border-radius:9px;color:var(--chalk);font-family:var(--font);font-size:14px;padding:8px 10px;outline:none;width:100%;transition:.15s;}
  .inp:focus{border-color:#4b463d;}
  .inp::placeholder{color:var(--muted);}
  input[type=date].inp{font-family:var(--mono);color-scheme:dark;max-width:190px;}

  .exrow{display:grid;grid-template-columns:1fr auto 30px;gap:8px;align-items:center;margin-bottom:10px;}
  .ex-detail{grid-column:1 / -1;font-size:13px;}
  .stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--raise);}
  .stepper button{width:30px;height:32px;border:none;background:transparent;color:var(--dim);cursor:pointer;display:grid;place-items:center;transition:.12s;}
  .stepper button:hover{color:var(--chalk);background:#332D26;}
  .stepper .val{min-width:30px;text-align:center;font-family:var(--mono);font-size:14px;color:var(--chalk);}

  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px;}
  .chipgroup{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-bottom:8px;}
  .chipglabel{font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;font-size:10px;color:var(--muted);width:62px;flex:none;}
  .chip{border:1px solid var(--line);background:var(--raise);color:var(--dim);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:5px;}
  .chip:hover{color:var(--chalk);border-color:#4b463d;}

  .grades{display:flex;flex-wrap:wrap;gap:9px;}
  .gpill{position:relative;min-width:44px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--raise);color:var(--dim);font-family:var(--mono);font-weight:600;font-size:13px;cursor:pointer;display:grid;place-items:center;transition:.12s;}
  .gpill:hover{border-color:#5a544a;color:var(--chalk);}
  .gpill.on{color:#16130F;border-color:transparent;font-weight:700;}
  .gcount{position:absolute;top:-7px;right:-7px;min-width:18px;height:18px;border-radius:9px;background:#16130F;border:1px solid var(--line);color:var(--chalk);font-size:11px;display:grid;place-items:center;padding:0 4px;}
  .gminus{position:absolute;bottom:-8px;right:-8px;width:19px;height:19px;border-radius:10px;background:#16130F;border:1px solid var(--line);color:var(--dim);display:grid;place-items:center;cursor:pointer;}
  .gminus:hover{color:#E5484D;}

  .rpe{display:flex;gap:6px;flex-wrap:wrap;}
  .rbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--raise);color:var(--dim);font-family:var(--mono);font-weight:600;font-size:13px;cursor:pointer;transition:.12s;}
  .rbtn:hover{color:var(--chalk);}
  .rbtn.sel{color:#16130F;border-color:transparent;font-weight:700;box-shadow:0 0 0 2px rgba(255,255,255,.08);}

  .btn{border:none;border-radius:11px;padding:11px 16px;font-family:var(--font);font-weight:700;font-size:14px;cursor:pointer;letter-spacing:.02em;transition:.15s;}
  .btn.primary{background:var(--chalk);color:#16130F;}
  .btn.primary:hover{background:#fff;}
  .btn.primary:disabled{opacity:.38;cursor:not-allowed;}
  .btn.ghost{background:var(--raise);color:var(--chalk);border:1px solid var(--line);font-weight:600;}
  .btn.ghost:hover{border-color:#4b463d;}
  .datarow{display:flex;gap:8px;flex-wrap:wrap;}
  .dmsg{font-family:var(--mono);font-size:12px;margin-top:11px;line-height:1.5;}
  .dmsg.ok{color:#33C39E;}
  .dmsg.err{color:#E5484D;}

  textarea.inp{min-height:92px;resize:vertical;line-height:1.6;font-family:var(--font);display:block;}
  .snote{font-size:13.5px;color:var(--dim);white-space:pre-wrap;border-left:2px solid var(--line);padding-left:11px;line-height:1.6;}
  .stag.try{background:transparent;}

  /* project tracker */
  .proj{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
  .proj.sent{border-color:#2f5a4c;}
  .projhead{display:flex;align-items:flex-start;gap:10px;}
  .projname{font-size:16px;font-weight:700;color:var(--chalk);flex:1;min-width:0;word-break:break-word;}
  .projgrade{font-family:var(--mono);font-weight:700;font-size:12.5px;padding:3px 9px;border-radius:8px;color:#16130F;flex:none;}
  .projmeta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:7px;display:flex;flex-wrap:wrap;gap:4px 12px;}
  .projmeta .done{color:#33C39E;}
  .golog{margin-top:12px;border-top:1px solid var(--line);padding-top:6px;}
  .gorow{display:flex;align-items:baseline;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);}
  .gorow:last-child{border-bottom:none;}
  .godate{font-family:var(--mono);font-size:11.5px;color:var(--muted);width:54px;flex:none;}
  .gotries{font-family:var(--mono);font-size:12px;color:var(--chalk);flex:none;width:52px;}
  .gonote{flex:1;min-width:0;color:var(--dim);word-break:break-word;}
  .goform{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
  .goform .inp{flex:1;min-width:130px;}
  .projactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .btn.sm{padding:8px 12px;font-size:13px;border-radius:9px;}

  /* guide resources */
  .res{display:flex;flex-direction:column;gap:9px;margin-top:10px;}
  .reslink{display:block;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);text-decoration:none;transition:.15s;}
  .reslink:hover{border-color:#4b463d;}
  .resname{font-weight:700;font-size:14.5px;color:var(--chalk);}
  .resdesc{font-size:12.5px;color:var(--dim);margin-top:3px;line-height:1.55;}
  .reshost{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:6px;}
  .callout{background:var(--panel);border:1px solid var(--line);border-left:3px solid #E7C13B;border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:13.5px;color:var(--dim);line-height:1.6;}
  .callout b{color:var(--chalk);}

  .scard{display:flex;flex-direction:column;gap:9px;}
  .shead{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .sdate{font-family:var(--mono);font-size:13px;color:var(--chalk);font-weight:600;letter-spacing:.02em;}
  .srpe{font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;color:#16130F;}
  .ssends{display:flex;flex-wrap:wrap;gap:6px;}
  .stag{font-family:var(--mono);font-size:12px;font-weight:600;padding:3px 8px;border-radius:7px;border:1px solid var(--line);}
  .sex{font-size:13px;color:var(--dim);}
  .sex b{color:var(--chalk);font-weight:600;}
  .sex .sd{color:var(--muted);}
  .del{background:transparent;border:none;color:var(--muted);cursor:pointer;display:grid;place-items:center;padding:4px;transition:.12s;}
  .del:hover{color:#E5484D;}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;}
  .stat .n{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--chalk);line-height:1.1;}
  .stat .k{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-top:6px;}
  .chart{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 12px 14px;margin-bottom:12px;}
  .ctitle{font-size:13.5px;font-weight:700;color:var(--chalk);margin:0 2px 1px;}
  .csub{font-family:var(--mono);font-size:11px;color:var(--muted);margin:0 2px 12px;}
  .cnote{font-size:13px;color:var(--muted);margin:2px;}

  .pyrow{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .pyg{font-family:var(--mono);font-size:12px;font-weight:700;width:30px;flex:none;}
  .pytrack{position:relative;flex:1;background:var(--raise);border-radius:6px;height:16px;overflow:hidden;}
  .pyghost{position:absolute;top:0;left:0;height:100%;border-radius:6px;opacity:.24;}
  .pybar{position:relative;height:100%;border-radius:6px;min-width:4px;}
  .pyc{font-family:var(--mono);font-size:12px;color:var(--dim);width:52px;text-align:right;flex:none;}

  .volrow{display:flex;align-items:flex-end;gap:8px;}
  .volcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;}
  .voltrack{height:120px;width:100%;display:flex;align-items:flex-end;}
  .volbar{width:100%;background:#33C39E;border-radius:5px 5px 0 0;min-height:3px;position:relative;display:flex;justify-content:center;}
  .voln{position:absolute;top:-16px;font-family:var(--mono);font-size:11px;color:var(--dim);}
  .vollab{font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap;}

  .pintro{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:16px;}
  .pintro b{color:var(--chalk);}
  .pintro .pisub{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .pillars{display:flex;flex-direction:column;gap:16px;}
  .pcard{background:var(--panel);border:1px solid var(--line);border-top:3px solid transparent;border-radius:16px;padding:18px 18px 8px;min-width:0;}
  .phead{display:flex;align-items:flex-start;gap:12px;}
  .picon{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.05);}
  .ptitle{flex:1;min-width:0;}
  .prow{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;}
  .pname{font-size:17px;font-weight:800;color:var(--chalk);letter-spacing:.01em;}
  .pstep{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;}
  .ptime{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;flex:none;margin-left:auto;padding-top:2px;}
  .pdesc{font-size:13px;color:var(--dim);margin-top:3px;}
  .pmethods{margin-top:14px;border-top:1px solid var(--line);}
  .pmethod{padding:14px 0;border-bottom:1px solid var(--line);}
  .pmethod:last-child{border-bottom:none;}
  .pmtop{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:5px;}
  .pmname{font-weight:700;font-size:14.5px;color:var(--chalk);}
  .pmtime{font-family:var(--mono);font-size:11px;color:var(--muted);flex:none;}
  .pmdesc{margin:0;font-size:13px;color:var(--dim);line-height:1.55;}
  .pmtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
  .pmtag{font-family:var(--font);font-size:12px;color:var(--dim);background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:4px 9px;}
  @media (min-width:860px){
    .wrap.wide{max-width:1060px;}
    .pillars{flex-direction:row;align-items:flex-start;}
    .pcard{flex:1;}
  }

  .empty{text-align:center;padding:36px 16px;color:var(--muted);}
  .empty svg{margin-bottom:10px;color:var(--dim);}
  .empty p{font-size:14px;margin:0;max-width:280px;margin-left:auto;margin-right:auto;}

  .foot{margin-top:22px;display:flex;justify-content:center;}
  .reset{background:transparent;border:none;color:var(--muted);font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:var(--mono);transition:.15s;}
  .reset:hover{color:#E5484D;}

  button:focus-visible,input:focus-visible{outline:2px solid #6aa9e8;outline-offset:2px;}
  @media (max-width:430px){
    .stats{grid-template-columns:repeat(2,1fr);}
    /* five tabs have to fit a 375px phone without wrapping */
    .tab{font-size:11px;gap:3px;padding:9px 2px;}
    .tab svg{width:13px;height:13px;}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ---------- storage (localStorage with in-memory fallback) ---------- */
var mem = {};
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return (k in mem) ? mem[k] : null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } }
function load(k, def){ var v = lsGet(k); if(v==null) return def; try{ return JSON.parse(v); }catch(e){ return def; } }
function save(k, v){ lsSet(k, JSON.stringify(v)); }

/* ---------- effort colour ramp (grades + RPE) ---------- */
var RAMP = [[0,'#4C9BE8'],[0.25,'#33C39E'],[0.5,'#E7C13B'],[0.72,'#F0873B'],[1,'#E5484D']];
function hexToRgb(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function lerp(a,b,t){ return a+(b-a)*t; }
function toHex(x){ var s=Math.round(x).toString(16); return s.length<2 ? '0'+s : s; }
function rampColor(t){
  t = Math.max(0, Math.min(1, t));
  for(var i=0;i<RAMP.length-1;i++){
    var t0=RAMP[i][0], c0=RAMP[i][1], t1=RAMP[i+1][0], c1=RAMP[i+1][1];
    if(t<=t1){ var k=(t-t0)/(t1-t0); var a=hexToRgb(c0), b=hexToRgb(c1);
      return '#'+toHex(lerp(a[0],b[0],k))+toHex(lerp(a[1],b[1],k))+toHex(lerp(a[2],b[2],k)); }
  }
  return RAMP[RAMP.length-1][1];
}
function gradeColor(g){ return rampColor(g/12); }
function rpeColor(r){ return rampColor((r-1)/9); }

/* ---------- dates ---------- */
function pad2(n){ return (n<10?'0':'')+n; }
function toLocal(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function todayStr(){ return toLocal(new Date()); }
function parseLocal(s){ var p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function fmtDate(s){ return parseLocal(s).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'}); }
function fmtShort(s){ return parseLocal(s).toLocaleDateString(undefined,{day:'numeric',month:'short'}); }
function weekStart(s){ var d=parseLocal(s); var off=(d.getDay()+6)%7; d.setDate(d.getDate()-off); return toLocal(d); }

/* ---------- constants ---------- */
var GRADES=[]; for(var gi=0; gi<=12; gi++) GRADES.push(gi);
var EX_GROUPS=[
  { label:'Strength', items:['Hangboard','Frenchies'] },
  { label:'Power', items:['Limit boulders','Campus'] },
  { label:'Technique', items:['Technique'] },
  { label:'Support', items:['Core','Antagonists'] }
];
var DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var DEFAULT_PLAN={ Mon:'Strength — hangboard + frenchies', Tue:'Rest / mobility', Wed:'Power — limit boulders + campus', Thu:'Rest / antagonists', Fri:'Technique — precision, tension, commitment', Sat:'Projecting — apply it', Sun:'Rest' };
function isRest(f){ return !f || !f.trim() || /rest/i.test(f); }

/* ---------- the V8 system (Guide tab) ---------- */
var PILLARS=[
  { name:'Finger strength', icon:'shield', color:'#33C39E', desc:'The gatekeeper. Most people stuck below V8 are stuck on fingers, not fitness.', time:'2×/week', methods:[
    { name:'Weighted max hangs', time:'2×/week', desc:'Half-crimp on a 20mm edge with added weight. The single most reliable driver of grade at this level — and the number worth tracking for two years.', tags:['7–10s hang','3–5 min rest','5–6 sets','Add weight, not time','Fresh fingers only'] },
    { name:'Repeaters', time:'1×/week', desc:'Strength-endurance: still pulling hard on the fifth go of a project, not just the first.', tags:['7s on / 3s off × 6','2–3 min between sets','Lighter than max hangs'] },
    { name:'Load management', time:'always', desc:'Two grades is a long campaign. Pulley injuries are what actually end it — not lack of motivation.', tags:['48h between finger sessions','Deload every 4th week','Joint ache ≠ muscle burn — stop'] }
  ]},
  { name:'Power', icon:'zap', color:'#F0873B', desc:'Force delivered fast. V8 moves are rarely static.', time:'1–2×/week', methods:[
    { name:'Limit bouldering', time:'1–2×/week', desc:'Problems at your absolute ceiling — a few hard moves, full effort, properly rested between goes.', tags:['Fresh, after a full warm-up','3–5 min between goes','Quality over quantity','~45 min, then stop'] },
    { name:'Campus / contact', time:'1×/week max', desc:'Recruitment — grip force the instant you hit the hold. High injury cost, so earn it before you use it.', tags:['Only after a year at V6+','Ladders, 1-3-5','Low volume','Never when fatigued'] }
  ]},
  { name:'Projecting skill', icon:'target', color:'#8A7DE0', desc:'At V8 the limiter is often tactics. Strong climbers still waste goes.', time:'every session', methods:[
    { name:'Work it in sections', desc:'Break the boulder up, solve each piece, then link. Repeating it start-to-finish from the ground burns skin and teaches nothing.', tags:['Isolate the crux','Rehearse exact beta','Link from the low point'] },
    { name:'Decide before you pull on', desc:'Goes are the scarcest resource you have. Read the sequence from the ground and commit.', tags:['One beta at a time','Change one variable per go'] },
    { name:'Write down every session', desc:'What failed and why. Patterns across weeks only show up in writing — this is what the diary is for.', tags:['High point','What slipped','How you felt'] }
  ]}
];

/* External resources — root domains only, all verified reachable. */
var RESOURCES=[

function ic(name, size){
  var s=size||16, span=document.createElement('span'); span.style.display='inline-flex';
  span.innerHTML='<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICONS[name]+'</svg>';
  return span;
}

/* ---------- dom helper ---------- */
function h(tag, props){
  var el=document.createElement(tag), i;
  if(props){
    for(var k in props){ if(!props.hasOwnProperty(k)) continue; var v=props[k];
      if(v==null) continue;
      if(k==='class') el.className=v;
      else if(k==='style' && typeof v==='object'){ for(var sk in v){ if(v.hasOwnProperty(sk)) el.style[sk]=v[sk]; } }
      else if(k.slice(0,2)==='on' && typeof v==='function') el.addEventListener(k.slice(2).toLowerCase(), v);
      else if(k in el){ try{ el[k]=v; }catch(e){ el.setAttribute(k,v); } }
      else el.setAttribute(k, v);
    }
  }
  for(i=2;i<arguments.length;i++){ appendKid(el, arguments[i]); }
  return el;
}
function appendKid(el, kid){
  if(kid==null || kid===false || kid==='') return;
  if(Array.isArray(kid)){ for(var i=0;i<kid.length;i++) appendKid(el, kid[i]); return; }
  el.appendChild(kid.nodeType ? kid : document.createTextNode(String(kid)));
}

/* ---------- state ---------- */
var plan = load('crux:plan', null) || Object.assign({}, DEFAULT_PLAN);
var sessions = load('crux:sessions', []);
var projects = load('crux:projects', []);
function saveProjects(){ save('crux:projects', projects); }

/* The draft survives a reload — phones evict backgrounded tabs aggressively,
   and losing a half-logged session mid-gym is the worst possible failure. */
function emptyDraft(){ return { date: todayStr(), exs: [], sends: {}, attempts: {}, notes: '', rpe: null }; }
function loadDraft(){
  var d = load('crux:draft', null);
  if(!d || typeof d !== 'object') return emptyDraft();
  return {
    date: typeof d.date === 'string' ? d.date : todayStr(),
    exs: Array.isArray(d.exs) ? d.exs : [],
    sends: (d.sends && typeof d.sends === 'object') ? d.sends : {},
    attempts: (d.attempts && typeof d.attempts === 'object') ? d.attempts : {},
    notes: typeof d.notes === 'string' ? d.notes : '',
    rpe: (typeof d.rpe === 'number') ? d.rpe : null
  };
}
var draft = loadDraft();
function saveDraft(){ save('crux:draft', draft); }
function clearDraft(){ draft = emptyDraft(); try{ localStorage.removeItem('crux:draft'); }catch(e){ delete mem['crux:draft']; } }

/* ---------- week view ---------- */
function buildWeek(){
  var wrap=h('div',{class:'wrap'});
  wrap.appendChild(h('p',{class:'hint'},'Your training week. Tap any day to rewrite it.'));
  DAYS.forEach(function(d){
    var row=h('div',{class:'day'+(isRest(plan[d])?' rest':'')});
    var mk=h('span',{class:'mk'});
    function renderMk(){ mk.innerHTML=''; if(isRest(plan[d])){ mk.appendChild(ic('moon',13)); } else { mk.appendChild(h('span',{class:'dot'})); } }
    renderMk();
    var input=h('input',{ class:'focus-in', value:plan[d]||'', placeholder:'Rest day — tap to add training',
      oninput:function(e){ plan[d]=e.target.value; save('crux:plan',plan); row.className='day'+(isRest(plan[d])?' rest':''); renderMk(); } });
    row.appendChild(h('span',{class:'dow'},d));
    row.appendChild(mk);
    row.appendChild(input);
    wrap.appendChild(row);
  });
  wrap.appendChild(h('div',{class:'foot'},
    h('button',{class:'reset', onclick:function(){ plan=Object.assign({},DEFAULT_PLAN); save('crux:plan',plan); renderView(); }},
      ic('rotate',13),'Reset plan to default')
  ));
  return wrap;
}

/* ---------- log view ---------- */
function canSave(){
  return draft.exs.length>0 || Object.keys(draft.sends).length>0 ||
         Object.keys(draft.attempts).length>0 || (draft.notes||'').trim()!=='' || draft.rpe!=null;
}

function buildLog(){
  var wrap=h('div',{class:'wrap'});
  var card=h('div',{class:'card'});

  card.appendChild(h('div',{class:'lbl first'},'Date'));
  card.appendChild(h('input',{ type:'date', class:'inp', value:draft.date, onchange:function(e){ draft.date=e.target.value; saveDraft(); } }));

  card.appendChild(h('div',{class:'lbl'},'Exercises & sets'));
  var exWrap=h('div',{});
  card.appendChild(exWrap);

  EX_GROUPS.forEach(function(grp){
    var gline=h('div',{class:'chipgroup'});
    gline.appendChild(h('span',{class:'chipglabel'}, grp.label));
    grp.items.forEach(function(p){
      gline.appendChild(h('button',{class:'chip', onclick:function(){ draft.exs.push({name:p,sets:3,detail:''}); renderExercises(); updateSave(); }},'+ '+p));
    });
    card.appendChild(gline);
  });
  var customRow=h('div',{class:'chipgroup'});
  customRow.appendChild(h('span',{class:'chipglabel'},'Other'));
  customRow.appendChild(h('button',{class:'chip', onclick:function(){ draft.exs.push({name:'',sets:0,detail:''}); renderExercises(); updateSave(); }}, ic('plus',12),'Custom'));
  card.appendChild(customRow);

  card.appendChild(h('div',{class:'lbl'},'Sends — tap a grade to add one'));
  var gradeWrap=h('div',{class:'grades'});
  card.appendChild(gradeWrap);

  card.appendChild(h('div',{class:'lbl'},'Attempts — tried hard, did not send'));
  var attWrap=h('div',{class:'grades'});
  card.appendChild(attWrap);

  card.appendChild(h('div',{class:'lbl'},'How hard did it feel? — RPE'));
  var rpeWrap=h('div',{class:'rpe'});
  card.appendChild(rpeWrap);

  card.appendChild(h('div',{class:'lbl'},'Session diary'));
  card.appendChild(h('textarea',{ class:'inp', value:draft.notes||'',
    placeholder:'What worked, what failed, how you felt. Beta, conditions, head game — the stuff the numbers miss.',
    oninput:function(e){ draft.notes=e.target.value; saveDraft(); } }));

  var saveRow=h('div',{style:{marginTop:'16px',display:'flex',gap:'10px',alignItems:'center',flexWrap:'wrap'}});
  var saveBtn=h('button',{class:'btn primary', onclick:saveSession},'Save session');
  var saveHint=h('span',{class:'hint', style:{margin:'0'}},'Add an exercise, a send, an attempt, a note or an RPE to save.');
  saveRow.appendChild(saveBtn); saveRow.appendChild(saveHint);
  card.appendChild(saveRow);

  wrap.appendChild(card);
  var historyWrap=h('div',{});
  wrap.appendChild(historyWrap);

  function renderExercises(){
    exWrap.innerHTML='';
    draft.exs.forEach(function(e, i){
      var nameInp=h('input',{class:'inp', value:e.name, placeholder:'Exercise', oninput:function(ev){ draft.exs[i].name=ev.target.value; saveDraft(); }});
      var valSpan=h('span',{class:'val'}, String(e.sets||0));
      var stepper=h('div',{class:'stepper'},
        h('button',{'aria-label':'One fewer set', onclick:function(){ draft.exs[i].sets=Math.max(0,(draft.exs[i].sets||0)-1); valSpan.textContent=draft.exs[i].sets; saveDraft(); }}, ic('minus',14)),
        valSpan,
        h('button',{'aria-label':'One more set', onclick:function(){ draft.exs[i].sets=(draft.exs[i].sets||0)+1; valSpan.textContent=draft.exs[i].sets; saveDraft(); }}, ic('plus',14))
      );
      var del=h('button',{class:'del', 'aria-label':'Remove exercise', onclick:function(){ draft.exs.splice(i,1); renderExercises(); updateSave(); }}, ic('x',16));
      var detail=h('input',{class:'inp ex-detail', value:e.detail, placeholder:'detail — e.g. 6×10s @ 20mm, or V5 project', oninput:function(ev){ draft.exs[i].detail=ev.target.value; saveDraft(); }});
      exWrap.appendChild(h('div',{class:'exrow'}, nameInp, stepper, del, detail));
    });
  }
  /* One renderer for both grids. Sends fill with the grade colour; attempts
     stay outlined, so a glance separates "done" from "worked on". */
  function renderGradeGrid(host, key){
    host.innerHTML='';
    GRADES.forEach(function(g){
      var c=draft[key][g]||0;
      var label=(key==='sends'?'send':'attempt');
      var pill=h('button',{ class:'gpill'+(c?' on':''), 'aria-label':'Add a V'+g+' '+label,
        onclick:function(){ draft[key][g]=(draft[key][g]||0)+1; renderGradeGrid(host,key); updateSave(); } },'V'+g);
      if(c){
        if(key==='sends'){ pill.style.background=gradeColor(g); }
        else { pill.style.color=gradeColor(g); pill.style.borderColor=gradeColor(g); }
        pill.appendChild(h('span',{class:'gcount'}, String(c)));
        pill.appendChild(h('span',{class:'gminus', role:'button', 'aria-label':'Remove a V'+g+' '+label,
          onclick:function(ev){ ev.stopPropagation(); var v=(draft[key][g]||0)-1; if(v<=0) delete draft[key][g]; else draft[key][g]=v; renderGradeGrid(host,key); updateSave(); }}, ic('minus',11)));
      }
      host.appendChild(pill);
    });
  }
  function renderRpe(){
    rpeWrap.innerHTML='';
    for(var n=1;n<=10;n++){ (function(n){
      var b=h('button',{class:'rbtn'+(draft.rpe===n?' sel':''), onclick:function(){ draft.rpe = draft.rpe===n ? null : n; renderRpe(); updateSave(); }}, String(n));
      if(draft.rpe===n) b.style.background=rpeColor(n);
      rpeWrap.appendChild(b);
    })(n); }
  }
  function updateSave(){ saveDraft(); var ok=canSave(); saveBtn.disabled=!ok; saveHint.style.display=ok?'none':''; }
  function renderHistory(){
    historyWrap.innerHTML='';
    var display=sessions.slice().sort(function(a,b){ return a.date>b.date?-1 : a.date<b.date?1 : (a.id>b.id?-1:1); });
    if(display.length===0){
      historyWrap.appendChild(h('div',{class:'empty'}, ic('up',26), h('p',{},'No sessions yet. Log your first one above.')));
      return;
    }
    display.forEach(function(s){
      var kids=[];
      var head=h('div',{class:'shead'},
        h('span',{class:'sdate'}, fmtDate(s.date)),
        h('div',{style:{display:'flex',alignItems:'center',gap:'8px'}},
          (s.rpe!=null ? h('span',{class:'srpe', style:{background:rpeColor(s.rpe)}}, 'RPE '+s.rpe) : null),
          h('button',{class:'del', 'aria-label':'Delete session on '+fmtDate(s.date), onclick:function(){ sessions=sessions.filter(function(x){return x.id!==s.id;}); save('crux:sessions',sessions); renderHistory(); }}, ic('trash',15))
        )
      );
      kids.push(head);
      var sendKeys=Object.keys(s.sends||{});
      if(sendKeys.length){
        var tags=h('div',{class:'ssends'});
        sendKeys.map(Number).sort(function(a,b){return a-b;}).forEach(function(g){
          tags.appendChild(h('span',{class:'stag', style:{color:gradeColor(g)}}, 'V'+g+' ×'+s.sends[g]));
        });
        kids.push(tags);
      }
      var attKeys=Object.keys(s.attempts||{});
      if(attKeys.length){
        var atags=h('div',{class:'ssends'});
        atags.appendChild(h('span',{class:'stag try', style:{color:'#7E766B',borderColor:'transparent',padding:'3px 0'}},'tried'));
        attKeys.map(Number).sort(function(a,b){return a-b;}).forEach(function(g){
          atags.appendChild(h('span',{class:'stag try', style:{color:gradeColor(g), borderColor:gradeColor(g), opacity:'.75'}}, 'V'+g+' ×'+s.attempts[g]));
        });
        kids.push(atags);
      }
      (s.exercises||[]).forEach(function(e){
        var line=h('div',{class:'sex'});
        line.appendChild(h('b',{}, e.name||'Exercise'));
        if(e.sets) line.appendChild(document.createTextNode(' · '+e.sets+(e.sets===1?' set':' sets')));
        if(e.detail) line.appendChild(h('span',{class:'sd'}, ' · '+e.detail));
        kids.push(line);
      });
      if(s.notes) kids.push(h('div',{class:'snote'}, s.notes));
      var card=h('div',{class:'card scard'});
      kids.forEach(function(k){ if(k) card.appendChild(k); });
      historyWrap.appendChild(card);
    });
  }
  function saveSession(){
    if(!canSave()) return;
    var cleanExs=draft.exs.map(function(e){ return {name:(e.name||'').trim(), sets:Number(e.sets)||0, detail:(e.detail||'').trim()}; })
      .filter(function(e){ return e.name||e.detail||e.sets; });
    var session={ id:newId(), date:draft.date, exercises:cleanExs,
      sends:Object.assign({},draft.sends), attempts:Object.assign({},draft.attempts),
      notes:(draft.notes||'').trim(), rpe:draft.rpe };
    sessions.unshift(session); save('crux:sessions',sessions);
    clearDraft();
    renderView();
  }

  renderExercises();
  renderGradeGrid(gradeWrap,'sends');
  renderGradeGrid(attWrap,'attempts');
  renderRpe(); updateSave(); renderHistory();
  return wrap;
}

/* ---------- project view ---------- */
var projArmed = null;

function projStats(p){
  var log=p.log||[];
  var tries=log.reduce(function(a,g){ return a+(Number(g.tries)||0); },0);
  var days={}; log.forEach(function(g){ days[g.date]=true; });
  var dates=log.map(function(g){ return g.date; }).sort();
  return { tries:tries, days:Object.keys(days).length, first:dates[0]||null, last:dates[dates.length-1]||null };
}

function buildProjectView(){
  var wrap=h('div',{class:'wrap'});
  wrap.appendChild(h('p',{class:'hint'},'Breaking a grade is usually one boulder over many sessions. Track the goes, not just the send.'));

  var addCard=h('div',{class:'card'});
  addCard.appendChild(h('div',{class:'lbl first'},'New project'));
  var nameIn=h('input',{class:'inp', placeholder:'Name it — e.g. Left arête, sit start'});
  var whereIn=h('input',{class:'inp', style:{marginTop:'8px'}, placeholder:'Where — gym, board or crag'});
  var gradeSel=h('select',{class:'inp', style:{marginTop:'8px', maxWidth:'110px'}});
  GRADES.forEach(function(g){ gradeSel.appendChild(h('option',{value:String(g), selected:(g===8)},'V'+g)); });
  var addBtn=h('button',{class:'btn primary sm', onclick:function(){
    var nm=nameIn.value.trim();
    if(!nm){ nameIn.focus(); return; }
    projects.unshift({ id:newId(), name:nm, grade:Number(gradeSel.value), where:whereIn.value.trim(),
      created:todayStr(), sent:null, log:[] });
    saveProjects(); renderView();
  }},'Add project');
  addCard.appendChild(nameIn); addCard.appendChild(whereIn);
  addCard.appendChild(h('div',{style:{display:'flex',gap:'8px',alignItems:'center',marginTop:'8px',flexWrap:'wrap'}}, gradeSel, addBtn));
  wrap.appendChild(addCard);

  if(projects.length===0){
    wrap.appendChild(h('div',{class:'empty'}, ic('target',26),
      h('p',{},'No projects yet. Add the boulder you are actually trying to send.')));
    return wrap;
  }

  var order=projects.slice().sort(function(a,b){
    if(!!a.sent !== !!b.sent) return a.sent ? 1 : -1;   // open projects first
    return (b.created||'') > (a.created||'') ? 1 : -1;
  });

  order.forEach(function(p){
    var st=projStats(p);
    var pc=h('div',{class:'proj'+(p.sent?' sent':'')});

    pc.appendChild(h('div',{class:'projhead'},
      h('span',{class:'projname'}, p.name),
      h('span',{class:'projgrade', style:{background:gradeColor(p.grade)}}, 'V'+p.grade)
    ));

    var meta=h('div',{class:'projmeta'});
    meta.appendChild(h('span',{}, st.tries+(st.tries===1?' go':' goes')));
    meta.appendChild(h('span',{}, st.days+(st.days===1?' session':' sessions')));
    if(p.where) meta.appendChild(h('span',{}, p.where));
    if(st.last) meta.appendChild(h('span',{}, 'last '+fmtShort(st.last)));
    if(p.sent) meta.appendChild(h('span',{class:'done'}, '✓ sent '+fmtShort(p.sent)));
    pc.appendChild(meta);

    if((p.log||[]).length){
      var golog=h('div',{class:'golog'});
      p.log.slice().sort(function(a,b){ return a.date<b.date?1:a.date>b.date?-1:0; }).forEach(function(g){
        golog.appendChild(h('div',{class:'gorow'},
          h('span',{class:'godate'}, fmtShort(g.date)),
          h('span',{class:'gotries'}, '×'+(g.tries||0)),
          h('span',{class:'gonote'}, g.note||'—'),
          h('button',{class:'del', 'aria-label':'Delete this go', onclick:function(){
            p.log=p.log.filter(function(x){ return x.id!==g.id; }); saveProjects(); renderView();
          }}, ic('x',14))
        ));
      });
      pc.appendChild(golog);
    }

    if(!p.sent){
      var dIn=h('input',{type:'date', class:'inp', value:todayStr(), style:{maxWidth:'150px',flex:'none'}});
      var tries=1;
      var tVal=h('span',{class:'val'},'1');
      var stepper=h('div',{class:'stepper', style:{flex:'none'}},
        h('button',{'aria-label':'One fewer go', onclick:function(){ tries=Math.max(1,tries-1); tVal.textContent=tries; }}, ic('minus',14)),
        tVal,
        h('button',{'aria-label':'One more go', onclick:function(){ tries=tries+1; tVal.textContent=tries; }}, ic('plus',14))
      );
      var nIn=h('input',{class:'inp', placeholder:'high point / what failed'});
      var logBtn=h('button',{class:'btn ghost sm', onclick:function(){
        p.log=p.log||[];
        p.log.push({ id:newId(), date:dIn.value||todayStr(), tries:tries, note:nIn.value.trim() });
        saveProjects(); renderView();
      }},'Log a go');
      pc.appendChild(h('div',{class:'goform'}, dIn, stepper, nIn, logBtn));
    }

    var actions=h('div',{class:'projactions'});
    actions.appendChild(h('button',{class:'btn ghost sm', onclick:function(){
      p.sent = p.sent ? null : todayStr(); saveProjects(); renderView();
    }}, p.sent ? 'Reopen' : 'Mark sent'));
    actions.appendChild(h('button',{class:'reset', style:{marginLeft:'auto'}, onclick:function(){
      if(projArmed!==p.id){ projArmed=p.id; renderView(); setTimeout(function(){ projArmed=null; },4000); return; }
      projects=projects.filter(function(x){ return x.id!==p.id; });
      projArmed=null; saveProjects(); renderView();
    }}, ic('trash',13), projArmed===p.id ? 'Tap again to delete' : 'Delete'));
    pc.appendChild(actions);

    wrap.appendChild(pc);
  });

  return wrap;
}

/* ---------- guide view ---------- */
function buildGuide(){
  var wrap=h('div',{class:'wrap wide'});
  wrap.appendChild(h('p',{class:'hint'},'Getting to V8 — three pillars, in order of priority.'));
  wrap.appendChild(h('div',{class:'callout'},
    h('b',{},'A note on the timeline. '),
    'V6+ to V8 is two grades. For most people that is seasons, not weeks — so the thing that decides it is ',
    h('b',{},'consistency and staying uninjured'),
    ', not any single session. Expect long flat stretches where nothing seems to move. That is normal, and it is exactly why the diary and the project log are worth keeping.'
  ));

  var pillars=h('div',{class:'pillars'});
  PILLARS.forEach(function(p, idx){
    var card=h('div',{class:'pcard', style:{borderTopColor:p.color}});
    card.appendChild(h('div',{class:'phead'},
      h('div',{class:'picon', style:{color:p.color}}, ic(p.icon,20)),
      h('div',{class:'ptitle'},
        h('div',{class:'prow'},
          h('span',{class:'pstep'}, '0'+(idx+1)),
          h('span',{class:'pname'}, p.name),
          h('span',{class:'ptime'}, p.time)
        ),
        h('p',{class:'pdesc'}, p.desc)
      )
    ));
    var methods=h('div',{class:'pmethods'});
    p.methods.forEach(function(m){
      var row=h('div',{class:'pmethod'});
      row.appendChild(h('div',{class:'pmtop'},
        h('span',{class:'pmname'}, m.name),
        (m.time ? h('span',{class:'pmtime'}, m.time) : null)
      ));
      row.appendChild(h('p',{class:'pmdesc'}, m.desc));
      if(m.tags && m.tags.length){
        var tw=h('div',{class:'pmtags'});
        m.tags.forEach(function(t){ tw.appendChild(h('span',{class:'pmtag'}, t)); });
        row.appendChild(tw);
      }
      methods.appendChild(row);
    });
    card.appendChild(methods);
    pillars.appendChild(card);
  });
  wrap.appendChild(pillars);

  wrap.appendChild(h('div',{class:'lbl'},'Resources'));
  var res=h('div',{class:'res'});
  RESOURCES.forEach(function(r){
    res.appendChild(h('a',{class:'reslink', href:r.url, target:'_blank', rel:'noopener noreferrer'},
      h('div',{class:'resname'}, r.name),
      h('div',{class:'resdesc'}, r.desc),
      h('div',{class:'reshost'}, r.url.replace(/^https?:\/\//,''))
    ));
  });
  wrap.appendChild(res);
  return wrap;
}

/* ---------- progress view ---------- */
function buildProgress(){
  var wrap=h('div',{class:'wrap'});

  var totals={}; sessions.forEach(function(s){ var sk=s.sends||{}; for(var g in sk){ if(sk.hasOwnProperty(g)) totals[g]=(totals[g]||0)+sk[g]; } });
  var attTotals={}; sessions.forEach(function(s){ var ak=s.attempts||{}; for(var g in ak){ if(ak.hasOwnProperty(g)) attTotals[g]=(attTotals[g]||0)+ak[g]; } });
  var hardest=null; for(var g0 in totals){ if(totals.hasOwnProperty(g0)){ var ng=+g0; if(hardest==null||ng>hardest) hardest=ng; } }
  var rpeVals=sessions.filter(function(s){return s.rpe!=null;});
  var avgRpe = rpeVals.length ? (rpeVals.reduce(function(a,s){return a+s.rpe;},0)/rpeVals.length) : null;
  var thisWk=weekStart(todayStr());
  var thisWeekVol=sessions.filter(function(s){return weekStart(s.date)===thisWk;}).reduce(function(a,s){ return a+(s.exercises||[]).reduce(function(x,e){return x+(Number(e.sets)||0);},0); },0);

  var stats=h('div',{class:'stats'},
    h('div',{class:'stat'}, h('div',{class:'n'}, String(sessions.length)), h('div',{class:'k'},'Sessions')),
    h('div',{class:'stat'}, h('div',{class:'n', style:{color: hardest!=null?gradeColor(hardest):'#F1EDE6'}}, hardest!=null?'V'+hardest:'—'), h('div',{class:'k'},'Hardest')),
    h('div',{class:'stat'}, h('div',{class:'n', style:{color: avgRpe!=null?rpeColor(avgRpe):'#F1EDE6'}}, avgRpe!=null?avgRpe.toFixed(1):'—'), h('div',{class:'k'},'Avg RPE')),
    h('div',{class:'stat'}, h('div',{class:'n'}, String(thisWeekVol)), h('div',{class:'k'},'Sets / wk'))
  );
  wrap.appendChild(stats);

  if(sessions.length===0){
    wrap.appendChild(h('div',{class:'empty'}, ic('trend',26), h('p',{},'Charts appear once you start logging. Head to Log and record a session.')));
    wrap.appendChild(buildDataCard());
    return wrap;
  }

  var pyr=h('div',{class:'chart'});
  pyr.appendChild(h('div',{class:'ctitle'},'Send pyramid'));
  pyr.appendChild(h('div',{class:'csub'},'sends by grade — faded bar is attempts'));
  var pyGrades={};
  Object.keys(totals).forEach(function(g){ pyGrades[g]=true; });
  Object.keys(attTotals).forEach(function(g){ pyGrades[g]=true; });
  var pyList=Object.keys(pyGrades).map(Number).sort(function(a,b){return b-a;});
  if(pyList.length===0){ pyr.appendChild(h('div',{class:'cnote'},'No sends or attempts logged yet.')); }
  else {
    var maxC=1;
    pyList.forEach(function(g){ maxC=Math.max(maxC, totals[g]||0, attTotals[g]||0); });
    pyList.forEach(function(g){
      var sc=totals[g]||0, ac=attTotals[g]||0;
      pyr.appendChild(h('div',{class:'pyrow'},
        h('span',{class:'pyg', style:{color:gradeColor(g)}},'V'+g),
        h('div',{class:'pytrack'},
          (ac ? h('div',{class:'pyghost', style:{width:(ac/maxC*100)+'%', background:gradeColor(g)}}) : null),
          (sc ? h('div',{class:'pybar', style:{width:(sc/maxC*100)+'%', background:gradeColor(g)}}) : null)
        ),
        h('span',{class:'pyc'}, sc + (ac ? ' / '+ac : ''))
      ));
    });
  }
  wrap.appendChild(pyr);

  var rp=h('div',{class:'chart'});
  rp.appendChild(h('div',{class:'ctitle'},"How hard it's felt"));
  rp.appendChild(h('div',{class:'csub'},'RPE per session over time'));
  var asc=sessions.slice().sort(function(a,b){ return a.date<b.date?-1 : a.date>b.date?1 : (a.id<b.id?-1:1); }).filter(function(s){return s.rpe!=null;});
  if(asc.length===0){ rp.appendChild(h('div',{class:'cnote'},'No RPE logged yet.')); }
  else {
    var W=300,H=140,pX=10,pY=14,n=asc.length;
    var pts=asc.map(function(s,i){ var x = n===1 ? W/2 : pX + i/(n-1)*(W-2*pX); var y = pY + (1-(s.rpe-1)/9)*(H-2*pY); return {x:x,y:y,rpe:s.rpe}; });
    var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="auto" style="display:block;overflow:visible">';
    [0,2.5,5,7.5,10].forEach(function(lv){ var y=pY+(1-(lv-1<0?0:(lv-1)/9))*(H-2*pY); if(lv===0){ y=pY+(H-2*pY); } svg+='<line x1="'+pX+'" y1="'+y+'" x2="'+(W-pX)+'" y2="'+y+'" stroke="#2d2820" stroke-width="1"/>'; });
    if(n>1){ svg+='<polyline fill="none" stroke="#8A837A" stroke-width="2" points="'+pts.map(function(p){return p.x+','+p.y;}).join(' ')+'"/>'; }
    pts.forEach(function(p){ svg+='<circle cx="'+p.x+'" cy="'+p.y+'" r="3.8" fill="'+rpeColor(p.rpe)+'" stroke="#16130F" stroke-width="1.2"/>'; });
    svg+='</svg>';
    var holder=h('div',{}); holder.innerHTML=svg; rp.appendChild(holder);
  }
  wrap.appendChild(rp);

  var vl=h('div',{class:'chart'});
  vl.appendChild(h('div',{class:'ctitle'},'Training volume'));
  vl.appendChild(h('div',{class:'csub'},'total sets per week'));
  var byWeek={}; sessions.forEach(function(s){ var w=weekStart(s.date); var sets=(s.exercises||[]).reduce(function(a,e){return a+(Number(e.sets)||0);},0); byWeek[w]=(byWeek[w]||0)+sets; });
  var weeks=Object.keys(byWeek).sort().slice(-8);
  if(weeks.length===0){ vl.appendChild(h('div',{class:'cnote'},'Log exercises with sets to see volume.')); }
  else {
    var maxS=1; weeks.forEach(function(w){ if(byWeek[w]>maxS) maxS=byWeek[w]; });
    var row=h('div',{class:'volrow'});
    weeks.forEach(function(w){
      row.appendChild(h('div',{class:'volcol'},
        h('div',{class:'voltrack'}, h('div',{class:'volbar', style:{height:(byWeek[w]/maxS*100)+'%'}}, h('span',{class:'voln'}, String(byWeek[w])))),
        h('span',{class:'vollab'}, fmtShort(w))
      ));
    });
    vl.appendChild(row);
  }
  wrap.appendChild(vl);

  wrap.appendChild(buildDataCard());
  return wrap;
}
/* ---------- backup / restore ---------- */
function newId(){ return Date.now()+'-'+Math.random().toString(36).slice(2,7); }

function exportData(){
  var payload={ app:'crux', schema:2, exported:new Date().toISOString(), plan:plan, sessions:sessions, projects:projects };
  var url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));
  var a=h('a',{href:url, download:'crux-backup-'+todayStr()+'.json'});
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  dataMsg={ text:'Backup downloaded.', ok:true }; renderView();
}

/* Defensive: a backup file is untrusted input, so every field is re-checked
   rather than trusted from the JSON. */
function normalizeSession(s){
  if(!s || typeof s!=='object') return null;
  if(typeof s.date!=='string' || !/^\d{4}-\d{2}-\d{2}$/.test(s.date)) return null;
  function gradeMap(src){
    var out={};
    if(src && typeof src==='object'){
      Object.keys(src).forEach(function(k){
        var g=Number(k), c=Math.round(Number(src[k]));
        if(isFinite(g) && g>=0 && g<=20 && isFinite(c) && c>0) out[g]=c;
      });
    }
    return out;
  }
  var sends=gradeMap(s.sends), attempts=gradeMap(s.attempts);
  var exercises=Array.isArray(s.exercises) ? s.exercises.map(function(e){
    if(!e || typeof e!=='object') return null;
    return { name:String(e.name||'').slice(0,120), sets:Math.max(0,Math.round(Number(e.sets))||0), detail:String(e.detail||'').slice(0,400) };
  }).filter(function(e){ return e && (e.name||e.detail||e.sets); }) : [];
  var rpe=Number(s.rpe);
  return {
    id: (typeof s.id==='string' && s.id) ? s.id : newId(),
    date: s.date,
    exercises: exercises,
    sends: sends,
    attempts: attempts,
    notes: String(s.notes||'').slice(0,5000),
    rpe: (isFinite(rpe) && rpe>=1 && rpe<=10) ? Math.round(rpe) : null
  };
}

function normalizeProject(p){
  if(!p || typeof p!=='object') return null;
  var nm=String(p.name||'').trim().slice(0,160);
  if(!nm) return null;
  var isDate=function(d){ return typeof d==='string' && /^\d{4}-\d{2}-\d{2}$/.test(d); };
  var g=Math.round(Number(p.grade));
  var log=Array.isArray(p.log) ? p.log.map(function(e){
    if(!e || typeof e!=='object' || !isDate(e.date)) return null;
    return { id:(typeof e.id==='string' && e.id) ? e.id : newId(), date:e.date,
             tries:Math.max(0,Math.round(Number(e.tries))||0), note:String(e.note||'').slice(0,600) };
  }).filter(Boolean) : [];
  return {
    id: (typeof p.id==='string' && p.id) ? p.id : newId(),
    name: nm,
    grade: (isFinite(g) && g>=0 && g<=20) ? g : 8,
    where: String(p.where||'').slice(0,160),
    created: isDate(p.created) ? p.created : todayStr(),
    sent: isDate(p.sent) ? p.sent : null,
    log: log
  };
}

function importData(file){
  var reader=new FileReader();
  reader.onerror=function(){ dataMsg={ text:"Couldn't read that file.", ok:false }; renderView(); };
  reader.onload=function(){
    var data;
    try{ data=JSON.parse(reader.result); }
    catch(e){ dataMsg={ text:'That file is not valid JSON.', ok:false }; renderView(); return; }
    if(!data || typeof data!=='object' || !Array.isArray(data.sessions)){
      dataMsg={ text:"That doesn't look like a CRUX backup.", ok:false }; renderView(); return;
    }
    var seen={}; sessions.forEach(function(s){ seen[s.id]=true; });
    var added=0, skipped=0;
    data.sessions.forEach(function(raw){
      var s=normalizeSession(raw);
      if(!s){ skipped++; return; }
      if(seen[s.id]){ skipped++; return; }
      seen[s.id]=true; sessions.push(s); added++;
    });
    save('crux:sessions',sessions);

    var projAdded=0;
    if(Array.isArray(data.projects)){
      var pSeen={}; projects.forEach(function(p){ pSeen[p.id]=true; });
      data.projects.forEach(function(raw){
        var p=normalizeProject(raw);
        if(!p || pSeen[p.id]) return;
        pSeen[p.id]=true; projects.push(p); projAdded++;
      });
      saveProjects();
    }

    var planNote='';
    if(data.plan && typeof data.plan==='object'){
      DAYS.forEach(function(d){ if(typeof data.plan[d]==='string') plan[d]=data.plan[d]; });
      save('crux:plan',plan); planNote=' Plan restored.';
    }
    dataMsg={ text:'Merged '+added+' session'+(added===1?'':'s')+
      (projAdded?' and '+projAdded+' project'+(projAdded===1?'':'s'):'')+
      (skipped?', skipped '+skipped+' already-present or invalid':'')+'.'+planNote, ok:true };
    renderView();
  };
  reader.readAsText(file);
}

function buildDataCard(){
  var card=h('div',{class:'card'});
  card.appendChild(h('div',{class:'lbl first'},'Data'));
  card.appendChild(h('p',{class:'cnote', style:{marginBottom:'12px'}},
    'Your log, diary and projects live only on this device. Export a backup before clearing browser data or switching phones.'));

  var picker=h('input',{ type:'file', accept:'application/json,.json', style:{display:'none'},
    onchange:function(e){ var f=e.target.files && e.target.files[0]; if(f) importData(f); e.target.value=''; } });

  card.appendChild(h('div',{class:'datarow'},
    h('button',{class:'btn ghost', onclick:exportData}, 'Export backup'),
    h('button',{class:'btn ghost', onclick:function(){ picker.click(); }}, 'Import backup'),
    picker
  ));

  if(dataMsg) card.appendChild(h('div',{class:'dmsg '+(dataMsg.ok?'ok':'err')}, dataMsg.text));

  card.appendChild(h('div',{class:'foot'},
    h('button',{class:'reset', onclick:function(){
      if(!resetArmed){ resetArmed=true; dataMsg=null; renderView(); setTimeout(function(){ resetArmed=false; },4000); return; }
      sessions=[]; projects=[]; plan=Object.assign({},DEFAULT_PLAN); clearDraft();
      save('crux:sessions',sessions); saveProjects(); save('crux:plan',plan);
      resetArmed=false; dataMsg={ text:'All data erased.', ok:false }; renderView();
    }}, ic('trash',13), resetArmed?'Tap again to erase everything':'Reset all data')
  ));
  return card;
}

/* ---------- render ---------- */
function renderView(){
  viewHost.innerHTML='';
  viewHost.appendChild(
    tab==='week' ? buildWeek() :
    tab==='log' ? buildLog() :
    tab==='project' ? buildProjectView() :
    tab==='guide' ? buildGuide() : buildProgress()
  );
}
function mount(){
  var app=document.getElementById('app'); app.innerHTML=''; app.className='app';
  app.appendChild(buildHeader());
  tabsHost=h('div',{}); app.appendChild(tabsHost);
  viewHost=h('div',{}); app.appendChild(viewHost);
  renderTabs(); renderView();

  if('serviceWorker' in navigator){ window.addEventListener('load', function(){ navigator.serviceWorker.register('./sw.js').catch(function(){}); }); }
}
mount();
</script>
